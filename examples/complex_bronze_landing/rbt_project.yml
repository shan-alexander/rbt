# Research-papers mini lakehouse
# Topic: semiconductors + ML / neuromorphic computing
# Bronze: PubMed + Crossref + arXiv (polite public APIs)
name: research_papers_lake
version: "1.0.0"
contract_version: "research-papers-v1"
models_dir: models
target_path: $lake/gold

roots:
  lake: lake

layers:
  staging:
    path: models/staging
    target_path: $lake/silver/stage
    default_format: parquet
  transforms:
    path: models/transforms
    target_path: $lake/gold/tf
    default_format: parquet
  marts:
    path: models/marts
    target_path: $lake/gold
    default_format: parquet
