# Multi-artifact bronze → silver stage endpoints → gold transforms → gold marts.
name: complex_bronze_landing
version: "0.3.0"
contract_version: "topology-v1"
models_dir: models
target_path: $lake/gold

roots:
  lake: lake

layers:
  staging:
    path: models/staging
    target_path: $lake/silver/stage
    default_format: parquet
  # Gold transforms: ref stg_* only (silver endpoints). Never silver/tf after stg.
  transforms:
    path: models/transforms
    target_path: $lake/gold/tf
    default_format: parquet
  marts:
    path: models/marts
    target_path: $lake/gold
    default_format: parquet
