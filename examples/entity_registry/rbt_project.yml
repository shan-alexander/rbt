# RBT-A7 showcase: Type-1 keyed_upsert entity registry
name: entity_registry
version: "1.0.0"
contract_version: "a7-v1"
models_dir: models
target_path: $lake/gold

roots:
  lake: lake

layers:
  staging:
    path: models/staging
    target_path: $lake/silver/stage
    default_format: parquet
  marts:
    path: models/marts
    target_path: $lake/gold
    default_format: parquet
