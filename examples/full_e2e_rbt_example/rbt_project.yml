# =============================================================================
# full_e2e_rbt_example — bronze → silver → gold (full Parquet rewrite DAG)
# =============================================================================
# Intentional choice for this sample: FULL PARQUET REWRITES each `rbt run`.
# That is a first-class DAG option for small/medium projects that want:
#   - dbt-shaped models, refs, tests, frontmatter
#   - medallion cleansing without Iceberg/catalog ops
# Iceberg remains the long-term SoR for multi-writer / time-travel lakes, but
# is not required here (and not faked).
#
# Runtime v0 keys (models_dir + layers.*) are loaded by rbt today.
#
# materialize.ref_strategy (optional):
#   parquet (default) — lake-as-truth re-read for {{ ref() }}  [recommended]
#   memtable          — keep MemTable when rows < memtable_max_rows (default 50000)
# See docs/REF_STRATEGY.md (includes Criterion wall-time vs RSS tradeoffs).
# =============================================================================

name: market_bars
version: "1.1.0"
profile: medallion_kimball

lake_root: ./lake
namespace: market_bars
env: dev

models_dir: models
target_path: lake/gold

# materialize:
#   ref_strategy: parquet
#   memtable_max_rows: 50000

layers:
  staging:
    path: models/staging
    target_path: lake/silver
    default_format: parquet   # full rewrite of staging tables

  transforms:
    path: models/transforms
    target_path: lake/silver
    default_format: parquet   # tf_symbol, tf_bar_metrics*

  marts:
    path: models/marts
    target_path: lake/gold
    default_format: parquet   # dim / fact / obt
