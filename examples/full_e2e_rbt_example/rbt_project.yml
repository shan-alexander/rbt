# =============================================================================
# Design A — pure SQL models → lake/sql_models_output/
# =============================================================================
# Models live under src/models/sql_models_approach/ (host crate tree).
#
# Design B (pure Rust, no .sql):
#   src/models/silver/**/*.rs + src/models/gold/**/*.rs
#   config: rbt_project_rust.yml
#   outputs: lake/rust_models_output/
#
# Shared bronze: lake/bronze/
#
# CLI
#   rbt run -p examples/full_e2e_rbt_example --select stg_ohlcv_1m,tf_indicators_1m,obt_stocks_1m
#
# Host (full universe + force + wall clock)
#   cargo run -p full-e2e-rbt-example -- -p examples/full_e2e_rbt_example both
# =============================================================================

name: full_e2e_design_a_sql
version: "2.1.0"
contract_version: "e2e-v2-design-a"

models_dir: src/models/sql_models_approach
target_path: $lake/sql_models_output/gold

roots:
  lake: lake

materialize:
  mode: stream
  ref_strategy: parquet

execution:
  concurrency:
    enabled: false
    max_workers: 1
    strategy: serial
    multi_value_fanout_threshold: 2
    dirty_part_skip: true
    large_parts_first: true

layers:
  staging:
    path: src/models/sql_models_approach/silver/staging
    target_path: $lake/sql_models_output/silver/stage
    default_format: parquet

  transforms:
    path: src/models/sql_models_approach/silver/transforms
    target_path: $lake/sql_models_output/silver/tf
    default_format: parquet

  marts:
    path: src/models/sql_models_approach/gold
    target_path: $lake/sql_models_output/gold
    default_format: parquet
