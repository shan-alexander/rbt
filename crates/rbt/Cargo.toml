[package]
# crates.io name: `rbt` is taken by an unrelated project.
name = "rbt-datalake"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Medallion SQL DAG engine for lakehouse transforms — library + `rbt` CLI"
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Full product by default (CLI install + DE examples). Embedders opt down:
#   rbt-datalake = { version = "0.10", default-features = false, features = ["sql", "parquet"] }
default = ["sql", "parquet", "jshift", "iceberg", "cli"]
# Markers for documentation / future splits; core always needs DF + Arrow + Parquet.
sql = []
parquet = []
# Optional heavy / specialized stack
jshift = ["dep:jshift"]
iceberg = ["dep:iceberg", "dep:iceberg-datafusion"]
cli = ["dep:clap"]

[lib]
# Library import path stays `rbt::…` even though the package is `rbt-datalake`.
name = "rbt"
path = "src/lib.rs"

[[bin]]
name = "rbt"
path = "src/main.rs"
doc = false
required-features = ["cli"]

[dependencies]
# async / runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# data stack (core)
arrow = { workspace = true }
parquet = { workspace = true }
datafusion = { workspace = true }
# optional data stack
iceberg = { workspace = true, optional = true }
iceberg-datafusion = { workspace = true, optional = true }
jshift = { workspace = true, optional = true }

# project / DAG
petgraph = { workspace = true }
minijinja = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
regex = "1.13"
sqlparser = "0.47"
walkdir = "2"
toml = "0.8"
globset = "0.4"
futures = { workspace = true }
tempfile = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

# cli (optional)
clap = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "downstream_ref"
harness = false

[[bench]]
name = "design_b_sql_vs_rust"
harness = false
