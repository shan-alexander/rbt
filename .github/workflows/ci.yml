name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: build + smoke fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p rbt-cli -p rbt-core -p rbt-engine -p rbt-materializer -p rbt-scan -p rbt-testing -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Release build CLI
        run: cargo build -p rbt-cli --release

      - name: Smoke fixture (compile / select / run / test / iceberg)
        run: bash scripts/smoke.sh
